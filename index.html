      content="نظام احترافي لإدارة الأموال الشخصية، الأصول، الالتزامات، الاستثمارات، وبناء الثروة باللغة العربية مع دعم الدينار العراقي والدولار الأمريكي."

      content="نظام احترافي لإدارة الأموال الشخصية، الأصول، الالتزامات، الاستثمارات، وبناء الثروة باللغة العربية."

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('wealth_os_theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (saved !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
