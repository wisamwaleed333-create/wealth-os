<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13233F" />
      <stop offset="100%" stop-color="#070E1A" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="25%" y1="10%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#F7E4A6" />
      <stop offset="38%" stop-color="#C8A24A" />
      <stop offset="78%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D78A" />
      <stop offset="100%" stop-color="#9E7B2C" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="url(#goldRing)" stroke-opacity="0.35" stroke-width="4" />

  <!-- Expanding ripples at the base: small drop creating great wealth -->
  <ellipse cx="256" cy="382" rx="142" ry="30" fill="none" stroke="#C8A24A" stroke-opacity="0.32" stroke-width="6" />
  <ellipse cx="256" cy="380" rx="94" ry="18" fill="none" stroke="#60A5FA" stroke-opacity="0.55" stroke-width="6" />

  <!-- Sculpted Water Droplet -->
  <path
    d="M256 96 C256 96 154 218 154 288 C154 344.3 199.7 390 256 390 C312.3 390 358 344.3 358 288 C358 218 256 96 256 96 Z"
    fill="url(#dropGrad)"
    stroke="#F7E4A6"
    stroke-opacity="0.7"
    stroke-width="5"
  />

  <!-- Inner specular droplet highlight -->
  <path
    d="M220 218 C198 250 190 282 198 312"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.65"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- Subtle rising spark inside the drop -->
  <path
    d="M256 238 L266 266 L294 276 L266 286 L256 314 L246 286 L218 276 L246 266 Z"
    fill="#FFFBEB"
    fill-opacity="0.88"
  />
</svg>
